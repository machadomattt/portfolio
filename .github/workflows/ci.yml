name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Type-check
        run: npx vue-tsc -b --noEmit

      - name: Build
        run: npm run build

      - name: Instalar browsers do Playwright
        run: npx playwright install --with-deps chromium

      - name: Rodar testes E2E
        # demo-failure.spec.ts falha de propósito para alimentar o estado
        # "falhou" no site (seção Testes) — não é uma falha real, então não
        # deve derrubar o CI. O build/produção continua validado normalmente.
        run: npx playwright test --grep-invert "demonstração proposital"

      - name: Publicar relatório do Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem Docker
        run: docker build -t portifolio:ci .
